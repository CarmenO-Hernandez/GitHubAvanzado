name: Comprobacion de Tokens

on:
  push:

jobs:
  comparar-tokens:
    runs-on: self-hosted

    steps:
      - name: Comparar DEV_TOKEN
        shell: powershell
        run: |
          if ("${{ secrets.DEV_TOKEN }}" -eq "$env:LOCAL_DEV_TOKEN") {
            Write-Host "Coinciden: DEV_TOKEN es igual."
          } else {
            Write-Host "No coinciden: DEV_TOKEN es diferente."
            exit 1
          }

      - name: Comparar PROD_TOKEN
        shell: powershell
        run: |
          if ("${{ secrets.PROD_TOKEN }}" -eq "$env:LOCAL_PROD_TOKEN") {
            Write-Host "Coinciden: PROD_TOKEN es igual."
          } else {
            Write-Host "No coinciden: PROD_TOKEN es diferente."
            exit 1
          }
